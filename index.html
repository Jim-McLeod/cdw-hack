<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canberra Data Walk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Canberra Data Walk</h1>
    <p id="walk-intro">Loading places&hellip;</p>
    <ul id="places-list"></ul>
  </main>

  <script src="app.js"></script>
  <script>
    fetchJson('/api/places').then(function (places) {
      document.getElementById('walk-intro').textContent =
        'Choose a place to learn more. ' + places.length + ' stops on this walk.';

      var list = document.getElementById('places-list');
      places.forEach(function (place) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = 'place.html?slug=' + encodeURIComponent(place.slug);
        a.textContent = place.name;
        li.appendChild(a);
        list.appendChild(li);
      });
    }).catch(function (err) {
      document.getElementById('walk-intro').textContent =
        'Could not load places: ' + err.message;
    });
  </script>
</body>
</html>

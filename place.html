<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Place - Canberra Data Walk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <p><a href="index.html">&larr; Back to all places</a></p>

    <article id="place">
      <p>Loading place&hellip;</p>
    </article>

    <section id="visit-form-section" hidden>
      <h2>Log your visit</h2>
      <form id="visit-form">
        <label for="visitor-name">Your name</label>
        <input id="visitor-name" name="visitorName" type="text" maxlength="100" required />

        <label for="visit-message">A short message (optional)</label>
        <textarea id="visit-message" name="message" maxlength="500" rows="3"></textarea>

        <button type="submit">Log visit</button>
      </form>
      <p id="visit-status" role="status"></p>
    </section>

    <section id="visit-history-section" hidden>
      <h2>Recent visits</h2>
      <ol id="visit-history"></ol>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    // Accept ?tag=... (NFC), ?slug=... (list page), or ?id=... (numeric).
    var params = new URLSearchParams(window.location.search);
    var apiUrl = '/api/place?' + params.toString();

    var currentPlaceId = null;

    fetchJson(apiUrl).then(function (place) {
      currentPlaceId = place.id;

      var mapUrl = 'https://www.openstreetmap.org/?mlat=' + place.latitude +
                   '&mlon=' + place.longitude +
                   '#map=18/' + place.latitude + '/' + place.longitude;

      var nextLink = place.nextPlaceSlug
        ? '<p><a href="place.html?slug=' + encodeURIComponent(place.nextPlaceSlug) + '">Next stop &rarr;</a></p>'
        : '';

      document.getElementById('place').innerHTML =
        '<div class="place-slug">' +
          '<span class="slug-label">Place ID:</span> ' +
          '<code class="slug-value">' + place.slug + '</code> ' +
          '<button type="button" class="copy-btn" onclick="copyToClipboard(\'' + place.slug + '\', this)">Copy</button>' +
        '</div>' +
        '<h1>' + place.name + '</h1>' +
        '<p><strong>Theme:</strong> ' + place.theme + '</p>' +
        '<h2>Story</h2><p>' + place.story + '</p>' +
        '<h2>Data prompt</h2><p>' + place.dataPrompt + '</p>' +
        '<h2>Accessibility</h2><p>' + place.accessibility + '</p>' +
        '<h2>Location</h2><p>' + place.latitude + ', ' + place.longitude +
        ' &mdash; <a href="' + mapUrl + '" target="_blank" rel="noopener">View on map</a></p>' +
        '<h2>Source</h2><p><a href="' + place.sourceUrl + '" target="_blank" rel="noopener">' +
        place.sourceUrl + '</a></p>' + nextLink;

      // Reveal the form and pre-fill the name from the cookie.
      document.getElementById('visit-form-section').hidden = false;
      document.getElementById('visitor-name').value = getVisitorName();

      // Hidden flag: ?showVisits reveals the visit history for this place.
      if (params.has('showVisits')) {
        loadVisitHistory(place.id);
      }
    }).catch(function (err) {
      document.getElementById('place').innerHTML =
        '<h1>Place not found</h1><p>' + err.message + '</p>';
    });

    document.getElementById('visit-form').addEventListener('submit', function (event) {
      event.preventDefault();

      var nameInput = document.getElementById('visitor-name');
      var messageInput = document.getElementById('visit-message');
      var status = document.getElementById('visit-status');

      var name = nameInput.value.trim();
      var message = messageInput.value.trim();

      if (!name || !currentPlaceId) {
        status.textContent = 'Please enter your name.';
        return;
      }

      setVisitorName(name);
      status.textContent = 'Logging visit...';

      fetchJson('/api/visits', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          placeId: currentPlaceId,
          visitorName: name,
          message: message
        })
      }).then(function (result) {
        status.textContent = 'Thanks ' + name + ' - visit logged at ' + result.visitedAt + '.';
        messageInput.value = '';
      }).catch(function (err) {
        status.textContent = 'Could not log visit: ' + err.message;
      });
    });

    function loadVisitHistory(placeId) {
      var section = document.getElementById('visit-history-section');
      var list = document.getElementById('visit-history');
      section.hidden = false;
      list.innerHTML = '<li>Loading&hellip;</li>';

      fetchJson('/api/visits?placeId=' + placeId).then(function (visits) {
        if (!visits.length) {
          list.innerHTML = '<li>No visits logged yet.</li>';
          return;
        }
        list.innerHTML = '';
        visits.forEach(function (visit) {
          var li = document.createElement('li');
          var when = new Date(visit.visitedAt).toLocaleString();
          var msg = visit.message ? ' &mdash; "' + escapeHtml(visit.message) + '"' : '';
          li.innerHTML = '<strong>' + escapeHtml(visit.visitorName) + '</strong> ' +
                         '<span class="visit-time">(' + when + ')</span>' + msg;
          list.appendChild(li);
        });
      }).catch(function (err) {
        list.innerHTML = '<li>Could not load visits: ' + escapeHtml(err.message) + '</li>';
      });
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    function copyToClipboard(text, button) {
      navigator.clipboard.writeText(text).then(function () {
        var original = button.textContent;
        button.textContent = 'Copied!';
        button.disabled = true;
        setTimeout(function () {
          button.textContent = original;
          button.disabled = false;
        }, 1500);
      }).catch(function () {
        button.textContent = 'Copy failed';
      });
    }
  </script>
</body>
</html>
